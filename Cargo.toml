[package]
name = "faf-browser"
version = "0.1.0"
edition = "2024"
description = "FAF BROWSER — Fast As Fuck. Navegador headless 100% Rust, minimalista e agressivamente rápido."
authors = ["Tiago Coelho"]

[dependencies]
# HTTP
reqwest = { version = "0.12", features = ["json", "socks", "cookies", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# HTML/DOM
scraper = "0.22"
# CSS
cssparser = "0.34"
selectors = "0.26"
tiny-skia = "0.11"
ab_glyph = "0.2"
# JS
rquickjs = { version = "0.12", features = ["parallel", "futures"] }
# CLI
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Erros
anyhow = "1"
thiserror = "2"
# Regex
regex = "1"
# Util
url = "2"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
time = "0.3"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
once_cell = "1.19"
# Config
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
rstest = "0.23"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[[bin]]
name = "debug_render"
path = "debug_render.rs"
